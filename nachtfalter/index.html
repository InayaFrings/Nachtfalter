<title>Nachtfalter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&family=Pinyon+Script&family=Bodoni+Moda:ital,wght@0,400;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: Leseraum mit drei Spalten – Navigationsleiste links, Salon in der Mitte, eigenes Porträt rechts. Nur Schwarz, Grau und Weiß. */
:root{
  --bg:#0a0a0b;          /* Tinte */
  --paper:#131314;       /* Karten */
  --paper-2:#1b1b1d;
  --line:#3b3b3f;
  --line-soft:#27272b;
  --fg:#ecebe7;          /* Pergamentweiß */
  --muted:#9c9a95;
  --dim:#6b6966;
  --ink:#0a0a0b;
  --f-display:'IM Fell English SC','IM Fell English',Georgia,serif;
  --f-ital:'IM Fell English',Georgia,serif;
  --f-body:'EB Garamond',Garamond,Georgia,serif;
  /* Profilfarben (werden im eigenen Profil überschrieben) */
  --p-bg:#131314; --p-panel:#1b1b1d; --p-fg:#ecebe7; --p-muted:#9c9a95; --p-line:#3b3b3f;
  --p-font:'IM Fell English SC',Georgia,serif; --p-pattern:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);color:var(--fg);font:17px/1.55 var(--f-body)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--fg);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
.lnk:hover{text-decoration-style:solid}
.pwwrap{position:relative;display:block}.pwwrap input{width:100%;padding-right:44px}
.pwwrap .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px;cursor:pointer;line-height:0}
.pwwrap .eye:hover,.pwwrap .eye:focus-visible{color:var(--fg)}
.muted{color:var(--muted)}
.lbl{font:400 13px var(--f-display);letter-spacing:.09em;color:var(--muted)}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr) 270px;gap:28px;max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
.rail{position:sticky;top:calc(28px + env(safe-area-inset-top,0px));align-self:start;display:grid;gap:20px}
.logo{font:400 32px/1 var(--f-display);letter-spacing:.01em;margin:0}
.rail{container-type:inline-size}.rail .logo{font-size:min(30px,15.5cqi);overflow-wrap:anywhere}.rail .logo-mark{width:min(96px,50cqi)}
.logo small{display:block;font:italic 15px/1.3 var(--f-ital);color:var(--muted);margin-top:8px;letter-spacing:0}
.rail ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nl{background:none;border:0;border-left:1px solid var(--line-soft);text-align:left;width:100%;padding:7px 12px;font:400 18px var(--f-display);color:var(--muted)}
.nl:hover{color:var(--fg)}
.nl[aria-current="page"]{color:var(--fg);border-left:2px solid var(--fg);background:linear-gradient(90deg,#ffffff10,transparent)}
.orn{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:16px;line-height:1}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}
main.main{display:grid;gap:22px;min-width:0;align-content:start}
main.main.wide{grid-column:2/-1}
.aside{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1100px){.shell{grid-template-columns:180px minmax(0,1fr)}.aside{grid-column:2}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:18px 48px}
  .rail{position:static;min-width:0;grid-template-columns:minmax(0,1fr)}
  .rail ul{display:flex;overflow-x:auto;gap:2px}
  .nl{border-left:0;border-bottom:1px solid var(--line-soft);white-space:nowrap;width:auto}
  .nl[aria-current="page"]{border-left:0;border-bottom:2px solid var(--fg)}
  .aside{grid-column:auto}
  main.main.wide{grid-column:auto}
}

.card{background:var(--paper);border:1px solid var(--line-soft);min-width:0}
.card-h{font:400 21px/1.2 var(--f-display);margin:0;padding:16px 18px 0}
.card-in{padding:14px 18px 18px;display:grid;gap:12px}
.btn{background:var(--fg);color:var(--ink);border:1px solid var(--fg);font:400 16px var(--f-display);letter-spacing:.04em;padding:7px 18px}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn:disabled{background:transparent;color:var(--dim);border:1px dashed var(--line);cursor:not-allowed}
.bdate{border:0;padding:0;margin:0;min-width:0}.bsels{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px}
.bsel{width:100%;background:#0d0d0e;color:var(--fg);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:16px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input[type=text],input[type=url],input[type=password],input[type=date],input[type=email],input[type=tel],textarea{width:100%;background:#0d0d0e;color:var(--fg);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:16px}
input[type=date]{color-scheme:dark;min-height:42px}
textarea{resize:vertical;min-height:80px}
input[type=file]{font:15px var(--f-body);color:var(--muted);max-width:100%}
label.f{display:grid;gap:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}

/* Porträt mit Rahmen */
.portrait{--rad:0;position:relative;width:200px;max-width:100%;aspect-ratio:7/9;margin-inline:auto;flex:none}
.portrait .pic{position:absolute;inset:0;overflow:hidden;border-radius:var(--rad);background:radial-gradient(ellipse at 50% 32%,#ffffff26,transparent 68%),var(--p-panel)}
.portrait .pic svg{width:100%;height:100%;display:block}
.shape-oval{--rad:50%}
.shape-bogen{--rad:50% 50% 0 0/36% 36% 0 0}
.fr-schlicht .pic{border:1px solid var(--p-line)}
.fr-doppel .pic{border:6px double var(--p-fg)}
.fr-ornament .pic{border:2px solid var(--p-fg);box-shadow:0 0 0 5px var(--p-bg),0 0 0 6px var(--p-fg)}
.fr-ornament::before,.fr-ornament::after{content:"❦\FE0E";position:absolute;left:50%;transform:translateX(-50%);font:22px/1 Georgia,serif;color:var(--p-fg);background:var(--p-bg);padding:0 6px;z-index:1}
.fr-ornament::before{top:-18px}
.fr-ornament::after{bottom:-18px;transform:translateX(-50%) rotate(180deg)}
.fr-dornen .pic{border:2px solid var(--p-fg)}
.fr-dornen::after{content:"";position:absolute;inset:-8px;border:2px dashed var(--p-muted);border-radius:var(--rad);pointer-events:none}
.cameo{width:42px;height:42px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#ffffff22,transparent 70%),var(--paper-2);flex:none;display:block}
.cameo svg{width:100%;height:100%;display:block}

/* Salon */
.tabs{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 0 6px;font:400 17px var(--f-display);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs .pts{font:italic 14px var(--f-ital);margin-left:4px}
.post{padding:18px;display:grid;gap:12px;border-top:1px solid var(--line-soft)}
.feed .post:first-child{border-top:0}
.ph{display:flex;gap:12px;align-items:center}
.who{font:400 18px var(--f-display)}
.meta{display:block;font:italic 14px var(--f-ital);color:var(--muted)}
.thought{margin:0;font:italic 24px/1.35 var(--f-ital);padding-left:18px;border-left:1px solid var(--line);white-space:pre-wrap;word-break:break-word;text-wrap:pretty}
.caption{margin:0;white-space:pre-wrap;word-break:break-word}
.photo{width:100%;display:block;border:1px solid var(--line-soft);aspect-ratio:4/5;object-fit:cover;background:#0b0b0d}
.vframe{position:relative;width:100%;aspect-ratio:4/5;border:1px solid var(--line-soft);background:#0b0b0d;display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;color:var(--fg)}.vframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}.vframe .play{position:relative;width:64px;height:64px;border-radius:50%;border:1px solid var(--fg);background:#000a;display:grid;place-items:center;font-size:20px}.vframe iframe{width:100%;aspect-ratio:16/9;border:0}
.pdel{margin-left:auto;align-self:start}.pi .cmt .lnk{font-size:12px}
.vid{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:12px;color:var(--fg);text-decoration:none;word-break:break-all;background:repeating-linear-gradient(90deg,transparent 0 14px,#ffffff08 14px 16px)}
.vid:hover{border-color:var(--fg)}
.vid .play{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--fg);display:grid;place-items:center;font-size:13px}
.reacts{display:flex;flex-wrap:wrap;gap:6px}
.reacts button{filter:grayscale(1);background:transparent;border:1px solid var(--line);padding:2px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.reacts button[aria-pressed="true"]{border-color:var(--fg);background:#ffffff14}
.cmts{display:grid;gap:6px;font-size:16px}
.cmt{border-top:1px dotted var(--line);padding-top:6px}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}

/* Seitenleiste */
.me-card{padding:30px 18px 22px;display:grid;gap:22px;justify-items:center;text-align:center}
.me-card .portrait{width:150px}
.sname{font:400 24px/1.1 var(--f-display)}
.spts{font:italic 16px var(--f-ital);color:var(--muted)}
.spts b{font:400 30px/1 var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums;display:block}
ul.earn{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:16px}
ul.earn li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line-soft);padding-bottom:3px}
ul.earn b{font:400 16px var(--f-display);font-variant-numeric:tabular-nums}
.note{margin:0;font:italic 14px/1.4 var(--f-ital);color:var(--muted)}
ul.zlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.zlist li{display:flex;gap:10px;align-items:center}
ul.zlist small{display:block;font:italic 14px var(--f-ital);color:var(--muted)}

/* Eigenes Profil (Farben kommen aus dem Thema) */
.themed{--tp:clamp(20px,4vw,40px);background-color:var(--p-bg);background-image:var(--p-pattern);color:var(--p-fg);border:1px solid var(--line);padding:var(--tp);display:grid;gap:26px;min-width:0}
.themed .lnk{color:var(--p-fg)}
.themed .btn{background:var(--p-fg);color:var(--p-bg);border-color:var(--p-fg)}
.themed .btn.ghost{background:transparent;color:var(--p-fg);border-color:var(--p-line)}
.themed input[type=text],.themed textarea{background:var(--p-panel);color:var(--p-fg);border-color:var(--p-line)}
.themed .muted,.themed .meta{color:var(--p-muted)}
.phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center}
.phead .portrait{width:210px}
.posecard{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}@media (max-width:600px){.posecard{grid-template-columns:minmax(0,1fr)}}
.fullfig.mv-jump{padding-top:18%}
.fullfig.mv-jump svg,.ritem.mv-jump>svg{animation:avjump 1.1s ease-in-out infinite;transform-origin:50% 100%}
.fullfig.mv-spin svg,.ritem.mv-spin>svg{animation:avspin 2.4s ease-in-out infinite}
.fullfig.mv-wink svg,.ritem.mv-wink>svg{animation:avwink 1.6s ease-in-out infinite}
@keyframes avjump{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.04,.95)}45%{transform:translateY(-14%) scale(.98,1.03)}70%{transform:translateY(0) scale(1.03,.96)}}
@keyframes avspin{0%{transform:scaleX(1)}25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes avwink{0%,100%{transform:rotate(0)}25%{transform:rotate(1.5deg)}75%{transform:rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){.fullfig svg,.ritem>svg{animation:none!important}}
.fullfig{max-width:220px;margin:0 auto}.fullfig svg{width:100%;height:auto;display:block}.fullav .chips{justify-content:center}
.emo{width:1.35em;height:1.35em;vertical-align:-.3em;display:inline-block;margin:0 .05em}
.emobtn{background:none;border:1px solid var(--line,#444);border-radius:999px;width:38px;height:38px;padding:5px;cursor:pointer;flex:none;display:inline-grid;place-items:center}
.emobtn:hover,.emobtn:focus-visible{border-color:#ecebe7}.emobtn .emo{width:24px;height:24px;margin:0;vertical-align:0}
.emopop{position:absolute;z-index:200;background:#0e0e10;border:1px solid #6a6a70;padding:8px;display:grid;grid-template-columns:repeat(4,40px);gap:4px;box-shadow:0 10px 30px #000a;max-width:calc(100vw - 16px)}
.emopop button{background:none;border:1px solid transparent;width:40px;height:40px;padding:4px;cursor:pointer;border-radius:6px}
.emopop button:hover,.emopop button:focus-visible{border-color:#ecebe7;background:#1c1c20}.emopop .emo{width:30px;height:30px;margin:0;vertical-align:0}
.pcover{width:100%;aspect-ratio:1200/340;background:#0e0e10 center/cover no-repeat;border:1px solid var(--p-line);margin:0 0 14px}
.topcover{width:100%;height:clamp(110px,21.9vw,420px);background:#0e0e10 center/cover no-repeat;border-bottom:1px solid var(--line)}
.themed>.pcover:first-child{width:auto;margin:calc(-1 * var(--tp)) calc(-1 * var(--tp)) 0;border:0;border-bottom:1px solid var(--p-line)} /* Banner ganz oben: von Ecke zu Ecke */
.ropen{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 14px;border:1px dashed var(--line);padding:12px 14px;margin:0 0 14px}
.ropen.pro{border-color:var(--p-line);background:#0008;color:var(--p-fg);align-items:center}
#fgrow.flash{animation:fgflash 1.4s ease}@keyframes fgflash{0%,60%{outline:2px solid #ecebe7;outline-offset:6px}100%{outline:2px solid transparent;outline-offset:6px}}
#preview .pname,#preview .phandle,#preview .phl,#preview .pmeta{cursor:pointer}
.proom{position:relative;cursor:pointer;display:block}.proom .proom-hint{position:absolute;right:10px;bottom:10px;background:rgba(10,10,12,.82);color:#ecebe7;border:1px solid rgba(255,255,255,.3);padding:5px 10px;font-size:13px;letter-spacing:.06em;opacity:.85;transition:opacity .15s}.proom:hover .proom-hint,.proom:focus .proom-hint{opacity:1}.proom:hover{outline:1px solid rgba(255,255,255,.35)}
.psteck{margin:22px 0 8px;padding:14px 16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25)}.psteck .lbl{margin:0 0 8px}.psteck .steck2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 28px}.psteck .steck{margin:0}.psteck .steck dd{white-space:pre-line}.pjoined{margin:22px 0 0;text-align:center;opacity:.7}
.pleft{display:grid;gap:12px;justify-items:center;text-align:center}.pleft .pname{font-size:clamp(34px,5vw,50px);line-height:1.3;margin-bottom:14px}.ppic{justify-content:center}
@media (max-width:600px){.phead{grid-template-columns:minmax(0,1fr);text-align:center;gap:28px}.pstats{justify-content:center}.pmeta{justify-content:center}}
.pname{font:400 clamp(36px,6vw,58px)/1.05 var(--p-font);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.badge{display:inline-block;margin-top:8px;font:400 13px var(--f-display);letter-spacing:.09em;border:1px solid var(--p-line);padding:2px 10px;color:var(--p-muted)}
.phl{font:italic 19px/1.35 var(--f-ital);color:var(--p-muted);margin:8px 0 0}
.pstats{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;font-size:16px;color:var(--p-muted)}
.pstats b{color:var(--p-fg);font-weight:500;font-variant-numeric:tabular-nums}
.pmeta{display:grid;grid-template-columns:auto auto;justify-content:start;gap:3px 14px;margin:14px 0 16px;font-size:16px}
.pabout{margin:-4px 0 16px;white-space:pre-wrap;font:italic 17px/1.45 var(--f-ital);color:var(--p-fg)}
.pmeta dt{font:400 13px/1.9 var(--f-display);letter-spacing:.09em;color:var(--p-muted)}
.pmeta dd{margin:0}
.pz{display:flex;flex-wrap:wrap;gap:16px}
.pz .m{display:grid;justify-items:center;gap:4px;font-size:15px}
.pz .cameo{width:58px;height:58px;border-color:var(--p-line)}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--p-line);flex-wrap:wrap}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;font:400 18px var(--f-display);color:var(--p-muted)}
.ptabs button[aria-selected="true"]{color:var(--p-fg);border-bottom-color:var(--p-fg)}
.ppanel{display:grid;gap:14px}
.tiles{columns:2 220px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:14px;background:var(--p-panel);border:1px solid var(--p-line);padding:14px;display:grid;gap:8px}
.tile .thought{font-size:20px;border-left-color:var(--p-line)}
.tile img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.tile .meta{font-size:13px}
.vid.p{color:var(--p-fg);border-color:var(--p-line)}
.vid.p .play{border-color:var(--p-fg)}
dl.steck{margin:0;display:grid;gap:12px}
dl.steck dt{font:400 13px var(--f-display);letter-spacing:.09em;color:var(--p-muted)}
dl.steck dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.gb{display:grid;gap:10px}
.steps .lnk{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.handle-in{display:flex;align-items:center;gap:4px}.handle-in b{font-weight:400;color:var(--muted)}.handle-in input{flex:1;min-width:0}
.phandle{margin:-4px 0 6px;font:italic 16px var(--f-ital);color:var(--p-muted)}
.allg{display:flex;gap:8px;align-items:center;font:italic 15px var(--f-ital);color:var(--muted);cursor:pointer}
.rules{white-space:pre-wrap;background:var(--p-panel);border:1px solid var(--p-line);padding:16px 18px;line-height:1.6}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px 2px;margin-bottom:10px}
.bubble{max-width:80%;padding:9px 13px;border:1px solid var(--p-line);background:var(--p-panel);white-space:pre-wrap;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--p-fg);color:var(--p-bg);border-color:var(--p-fg)}
.bubble.typing{font-style:italic;opacity:.7}
.gb .entry{background:var(--p-panel);border:1px solid var(--p-line);padding:10px 14px}

/* Zirkel */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.zcard{padding:30px 16px 22px;gap:22px;text-align:center;justify-items:center}
.zcard .portrait{width:140px}
.zcard .pname{font-size:34px}
.zcard .phl{font-size:16px;margin:4px 0 0}

/* Garderobe */
.wardrobe{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.wardrobe{grid-template-columns:minmax(0,1fr)}}
.mirror{width:200px;aspect-ratio:9/17}
.mirror-card{padding:34px 18px 22px;display:grid;gap:26px;justify-items:center;text-align:center}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{background:var(--paper-2);border:1px solid var(--line-soft);display:grid;gap:6px;padding:8px;font-size:15px;align-content:start}
.item.on{border-color:var(--fg)}
.thumb{border:0;padding:0;aspect-ratio:1/1;width:100%;display:block;background:radial-gradient(circle at 50% 40%,#ffffff1f,transparent 70%),#0e0e10}
.thumb svg{width:100%;height:100%;display:block}
.iname{font:400 16px/1.2 var(--f-display)}
.price{font:italic 15px var(--f-ital);color:var(--muted)}
.item .btn{width:100%;padding:5px 8px;font-size:14px}

/* Profil gestalten */
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:1000px){.design{grid-template-columns:minmax(0,1fr)}}
.design .preview{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
@media (max-width:1000px){.design .preview{position:static;order:-1}}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

}

  });
}

function cropAsk(file, W, H){

        <label class="f"><span class="lbl">Zoom</span><input type="range" min="1" max="4" step="0.01" value="1" class="cropz"></label>
        <p class="note" style="margin:0">Verschieb das Bild mit dem Finger oder der Maus. Mit zwei Fingern oder dem Regler zoomst du.</p>
        <div class="row"><button type="button" class="btn ghost" data-c="no">Abbrechen</button><span class="sp"></span><button type="button" class="btn" data-c="ok">Fertig</button></div></div>`;
      document.body.appendChild(m);
      const box = m.querySelector('.cropbox'), im = m.querySelector('img'), z = m.querySelector('.cropz');
      im.src = img.src;
      let s = 1, x = 0, y = 0;

/* ---------- Freunde, Chats und Owner (geteilt über die Datenbank) ---------- */
// Jede Person schreibt nur ihre eigenen Dokumente: profiles/<id>, friends/<id>, handles/<id>.
// Freundschaft = beide Listen enthalten sich gegenseitig. Chats liegen unter chats/<chatId>/m.
const PROF = {};
const FR = {mine:[], inc:[], ready:false, results:null, q:''};
const CH = {list:[], open:null, msgs:[], unsub:null, mode:null, gdraft:null};
let social = null, pubTimer = null, OWNER = null, amOwner = false;
function socialStart(){
  if (social || !cloud?.db || !me()) return;
  social = {db:cloud.db, uid:cloud.uid};
  setInterval(() => { if (!document.hidden) syncFriends(); }, 90000); // Freundesprofile regelmäßig auffrischen
  const db = social.db;
  db.collection('friends').where('list', 'array-contains', social.uid).onSnapshot(snap => { FR.inc = snap.docs.map(d => d.id).filter(id => id !== social.uid); syncFriends(); }, () => {});
  db.collection('chats').where('members', 'array-contains', social.uid).onSnapshot(snap => {
    CH.list = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.last || b.ts || 0) - (a.last || a.ts || 0));
    Promise.all(CH.list.flatMap(c => c.members).filter(id => id !== social.uid && !PROF[id]).map(loadProf)).then(softRender);
  }, () => {});
  db.doc('friends/' + social.uid).get().then(d => { FR.mine = d.exists ? (d.data().list || []) : []; FR.ready = true; syncFriends(); }).catch(() => {});
  db.doc('site/owner').get().then(async d => {
    OWNER = d.exists ? d.data().uid : null;
    if (amOwner && OWNER !== social.uid) { try { await db.doc('site/owner').set({uid:social.uid}); OWNER = social.uid; } catch {} }
    softRender();
  }).catch(() => {});
  publishProfile();
}
function softRender(){
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox')) && a.value) return;
  render();
}
async function loadProf(id){ try { const d = await social.db.doc('profiles/' + id).get(); if (d.exists) PROF[id] = d.data(); } catch {} }
function remoteUser(id, p){
  return {id, remote:true, name:p.name || 'Unbekannt', handle:p.handle || '', outfit:normOutfit({...(p.outfit || {})}), theme:normTheme({...(p.theme || BLANK_THEME())}),
    banner:p.banner || {pattern:'schlicht', mode:'nacht', font:'fell', text:''}, pic:p.pic || null, cover:p.cover || null, pose:p.pose || '', headline:p.headline || '', mood:p.mood || '', about:p.about || '',
    music:p.music || '', films:p.films || '', hobbies:p.hobbies || '', games2:p.games2 || '', songUrl:p.songUrl || '', songFile:p.songFile && p.songFile.n ? p.songFile : null, roomOpen:p.roomOpen || null, room:p.room || DEFAULT_ROOM(), deko:[], points:p.points || 0, earned:p.earned || 0,
    joined:p.joined || Date.now(), wall:[], owned:[], posts:(p.posts || []).map(x => ({...x, author:id, remote:true, reactions:{}, comments:[]}))};
}
const isFriend = id => FR.mine.includes(id) && FR.inc.includes(id);
// Anzahl Freunde fürs Profil: mit geteilter Datenbank die gegenseitigen, sonst alle anderen außer den Helfern
const friendCount = () => social ? FR.mine.filter(isFriend).length : Object.values(S.users).filter(x => x.id !== S.me && !x.helper).length;
let lastFC = null;
async function syncFriends(){
  if (!FR.ready) return;
  const ids = [...new Set([...FR.mine, ...FR.inc])];
  await Promise.all(ids.map(loadProf));
  for (const u of Object.values(S.users)) if (u.remote && !isFriend(u.id)) delete S.users[u.id];
  for (const id of ids) if (isFriend(id) && PROF[id]) S.users[id] = remoteUser(id, PROF[id]);
  if (friendCount() !== lastFC) { lastFC = friendCount(); publishProfile(); }
  softRender();
}
async function setMine(list){
  FR.mine = [...new Set(list)];
  try { await social.db.doc('friends/' + social.uid).set({list:FR.mine}); } catch { toast('Das hat nicht geklappt. Hast du Schreibrechte für Nachtfalter?'); }
  syncFriends();
}
let deleting = false;
function publishProfile(){
  if (!social || deleting) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(async () => {
    const u = me(); if (!u || u.remote) return;
    const posts = S.posts.filter(p => p.author === S.me).sort((a,b) => b.ts - a.ts).slice(0, 15)
      .map(p => ({id:p.id, type:p.type, text:p.text || '', url:p.url || '', img:'', bigimg:p.img ? 1 : 0, ts:p.ts, edited:p.edited || 0, full:p.img}));
    let budget = 120000; // kleine Bilder direkt im Profil, große als eigenes Dokument
    for (const x of posts) { if (x.full && x.full.length < 40000 && budget > x.full.length) { x.img = x.full; x.bigimg = 0; budget -= x.full.length; }
      else if (x.full && !PIMG_UP.has(x.id)) { PIMG_UP.add(x.id); social.db.doc('chats/pimg_' + social.uid + '/m/' + x.id).set({img:x.full, by:social.uid, ts:x.ts}).catch(() => PIMG_UP.delete(x.id)); }
      delete x.full; }
    const doc = {handle:u.handle || '', name:u.name, outfit:u.outfit, theme:u.theme, banner:u.banner?.img && u.banner.img.length > 60000 ? {...u.banner, img:null} : u.banner,
      pic:u.pic && u.pic.length < 90000 ? u.pic : null, cover:null, pose:u.pose || '', headline:u.headline || '', mood:u.mood || '', about:u.about || '', music:u.music || '', films:u.films || '',
      hobbies:u.hobbies || '', games2:u.games2 || '', songUrl:u.songUrl || '', songFile:u.songFile || null, roomOpen:u.roomOpen || null, room:u.room, seen:Date.now(), friends:friendCount(), points:u.points || 0, earned:u.earned || 0, joined:u.joined || Date.now(), posts, ts:Date.now()};
    const big = () => JSON.stringify(doc).length > 240000; // Dokumente dürfen höchstens 256 KB haben
    if (big()) doc.posts = posts.map(p => ({...p, img:''}));
    if (big()) doc.cover = null;
    if (big() && doc.banner) doc.banner = {...doc.banner, img:null};
    if (big()) doc.pic = null;
    try { await social.db.doc('profiles/' + social.uid).set(JSON.parse(JSON.stringify(doc))); } catch {}
  }, 1500);
}
async function searchPeople(q){

  catch { try { docs = (await social.db.collection('profiles').where('handle', '==', q).limit(5).get()).docs; } catch {} }

/* ---------- Chats ---------- */

async function sendMsg(cid, text, extra={}){

/* Sprechblasen über den Köpfen: neue Raumchat-Nachrichten erscheinen kurz über dem Avatar */
const SAID = new Set(), SAYT = {};
function sayBubbles(){
  const lay = document.getElementById('roomsay'); if (!lay) return;
  const now = Date.now();
  roomLive().forEach(m => {
    const key = m.from + ':' + m.ts;
    if (SAID.has(key)) return; SAID.add(key);
    if (!m.from || !m.text || now - (m.ts || 0) > 9000) return;
    sayOne(lay, m);
  });
}
function sayOne(lay, m){
  const room = lay.parentElement;
  const av = m.from === RM.owner ? room.querySelector('.ritem.av:not(.vis)') : room.querySelector(`.ritem.vis[data-uid="${CSS.escape(m.from)}"]`);
  if (!av) return;
  const R = room.getBoundingClientRect(), A = av.getBoundingClientRect();
  if (!R.width) return;
  lay.querySelector(`[data-from="${CSS.escape(m.from)}"]`)?.remove();
  clearTimeout(SAYT[m.from]);
  const b = document.createElement('div');
  b.className = 'say'; b.dataset.from = m.from;
  b.style.left = ((A.left + A.width / 2 - R.left) / R.width * 100).toFixed(2) + '%';
  b.style.top = Math.max(2, (A.top - R.top) / R.height * 100 + 3).toFixed(2) + '%';
  b.innerHTML = etx(m.text.length > 90 ? m.text.slice(0, 88) + '…' : m.text);
  lay.appendChild(b);
  SAYT[m.from] = setTimeout(() => { b.classList.add('gone'); setTimeout(() => b.remove(), 600); }, 4500 + Math.min(m.text.length, 90) * 60);
}

/* ---------- Profilsong (YouTube) ---------- */
function ytId(url){
  const m = String(url || '').trim().match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/|music\.youtube\.com\/watch\?(?:.*&)?v=)([\w-]{11})/i);
  return m ? m[1] : '';
}
let songOff = null;
/* Eigene Songs: die Datei liegt in Stücken unter profiles/<uid>/song/c<i> und spielt direkt hier im Player */
const SONG_MAX = 5 * 1024 * 1024, SONG_CHUNK = 200000, SONGS = {};
async function uploadSong(file, onStep){
  const b64 = await new Promise((ok, fail) => { const fr = new FileReader(); fr.onerror = fail; fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(file); });
  const n = Math.ceil(b64.length / SONG_CHUNK), v = Date.now(), old = me().songFile?.n || 0;
  for (let i = 0; i < n; i++) { await social.db.doc(`profiles/${social.uid}/song/c${i}`).set({v, d:b64.slice(i * SONG_CHUNK, (i + 1) * SONG_CHUNK)}); onStep?.(i + 1, n); }
  for (let i = n; i < old; i++) social.db.doc(`profiles/${social.uid}/song/c${i}`).delete().catch(() => {});
  return {n, v, type:/^audio\//.test(file.type) ? file.type : 'audio/mpeg', name:file.name.slice(0, 80)};
}
async function songURL(uid, f){
  const key = uid + ':' + f.v; if (SONGS[key]) return SONGS[key];
  const docs = await Promise.all(Array.from({length:f.n}, (_, i) => social.db.doc(`profiles/${uid}/song/c${i}`).get()));
  if (docs.some(d => !d.exists || d.data().v !== f.v)) throw new Error('unvollständig');
  const b64 = docs.map(d => d.data().d).join(''), bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const type = f.type || 'audio/mpeg';
  return SONGS[key] = {url:URL.createObjectURL(new Blob([arr], {type})), data:`data:${type};base64,${b64}`}; // data: als Ersatz, falls blob: blockiert ist
}
// Profilsong läuft unsichtbar im Hintergrund (YouTube-Player-Schnittstelle oder eigene Datei).
// Bedient wird er nur über den Knopf „♪ Musik an / aus“ im Profil.
let YTP = null, ytApi = null, songAudio = null, songErr = '', songPlaying = false;
function ytLoad(){
  return ytApi || (ytApi = new Promise(res => {
    if (window.YT?.Player) return res(YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(YT); };
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = () => { ytApi = null; res(null); };
    document.head.appendChild(sc);
  }));
}
function songKill(){
  if (YTP) { try { YTP.destroy(); } catch {} YTP = null; }
  if (songAudio) { songAudio.pause(); songAudio = null; }
  songPlaying = false;
}
function songMark(p){
  songPlaying = p;
  document.querySelectorAll('[data-act=music-toggle]').forEach(b => { b.setAttribute('aria-pressed', p); b.textContent = '♪ Musik ' + (p ? 'aus' : 'an'); });
}
function songPlay(){
  songErr && toast(songErr);
  if (YTP?.playVideo) { try { YTP.unMute(); YTP.setVolume(60); YTP.playVideo(); } catch {} }
  else if (songAudio) songAudio.play().then(() => songMark(true)).catch(() => {});
}
function songPause(){
  if (YTP?.pauseVideo) { try { YTP.pauseVideo(); } catch {} }
  if (songAudio) songAudio.pause();
  songMark(false);
}
// Viele Browser spielen Ton erst nach dem ersten Tippen: dann startet der Song beim ersten Tippen auf die Seite
document.addEventListener('pointerdown', e => {
  const u = V.name === 'profile' ? profUser(V.arg || S.me) : null;
  if (!u || songOff === u.id || songPlaying || songErr || e.target.closest?.('[data-act=music-toggle]')) return;
  songPlay();
}, true);
function syncSong(){
  const u = V.name === 'profile' ? profUser(V.arg || S.me) : null;
  const file = u && u.songFile && social ? u.songFile : null, vid = u && !file ? ytId(u.songUrl) : '';
  const dock = document.getElementById('songdock'); if (!dock) return;
  if (!vid && !file) { if (dock.dataset.v) { songKill(); dock.innerHTML = ''; dock.dataset.v = ''; } return; }
  const key = (file ? 'f' + file.v : vid) + u.id;
  if (dock.dataset.v === key) { songMark(songPlaying); return; }
  songKill(); songErr = ''; dock.dataset.v = key; dock.innerHTML = '';
  const auto = () => dock.dataset.v === key && songOff !== u.id;
  if (!file) {
    dock.innerHTML = '<div id="ytp"></div>';
    ytLoad().then(Y => {
      if (dock.dataset.v !== key) return;
      if (!Y) { songErr = 'Der Song ließ sich gerade nicht laden.'; return; }
      const pv = {autoplay:auto() ? 1 : 0, loop:1, playlist:vid, playsinline:1, controls:0, disablekb:1, rel:0, fs:0, iv_load_policy:3};
      if (/^https?:/.test(location.origin)) pv.origin = location.origin;
      YTP = new Y.Player('ytp', {width:200, height:113, videoId:vid, playerVars:pv, events:{
        onReady: e => { try { e.target.setVolume(60); if (auto()) e.target.playVideo(); } catch {} },
        onStateChange: e => songMark(e.data === 1 || e.data === 3),
        onError: e => { songMark(false); songErr = e.data === 101 || e.data === 150 || e.data === 153 ? 'Diesen Song lässt YouTube nur auf YouTube selbst laufen. Nimm im Profil einen anderen Link, zum Beispiel eine Version mit „Audio“ oder „Lyrics“ im Titel.' : 'Der Song ließ sich nicht abspielen. Prüf den YouTube-Link.'; }
      }});
    });
    return;
  }
  const owner = u.remote ? u.id : social.uid;
  songURL(owner, file).then(src => {
    if (dock.dataset.v !== key) return;
    const a = songAudio = new Audio(src.url); a.loop = true; a.volume = .6;
    a.addEventListener('error', () => { if (a.src.startsWith('blob:')) { a.src = src.data; if (auto()) a.play().catch(() => {}); } });
    a.addEventListener('play', () => songMark(true)); a.addEventListener('pause', () => songMark(false));
    if (auto()) a.play().catch(() => {});
  }).catch(() => { if (dock.dataset.v === key) songErr = 'Der Song ließ sich gerade nicht laden.'; });
}

const MIN_AGE = 16;
function ageOf(iso){ if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null; const [y, m, d] = iso.split('-').map(Number), t = new Date(); let a = t.getFullYear() - y; if (t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) a--; return a; }

let game = 'memory';
const GM = {mem:null, ttt:null, hang:null, bat:null};
const MEM_SYM = ['☾','✝','☠','✦','❦','♠','♥','✧'];
const HANG_WORDS = ['FLEDERMAUS','VAMPIR','FRIEDHOF','KERZENLICHT','SPINNENNETZ','MITTERNACHT','NACHTFALTER','TOTENKOPF','SCHATTEN','RABENSCHWARZ','GRUFT','KANDELABER','NEBELSCHWADEN','GEISTERSTUNDE','DORNENROSE'];
function setBest(k, v, higher){ S.games = S.games || {}; const b = S.games[k]; if (b == null || (higher ? v > b : v < b)) { S.games[k] = v; save(); return true; } return false; }
function memNew(){ const d = [...MEM_SYM, ...MEM_SYM].map(v => ({v, open:false, done:false})); for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } GM.mem = {d, pick:[], moves:0, lock:false}; }
function tttNew(){ GM.ttt = {b:Array(9).fill(''), over:'', turn:'X'}; }
function hangNew(){ GM.hang = {w:HANG_WORDS[Math.floor(Math.random() * HANG_WORDS.length)], g:[], miss:0}; }
const TTT_L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tttWin = b => { for (const [a,c,d] of TTT_L) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return b.every(Boolean) ? 'draw' : ''; };
function tttAI(b){
  const free = b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  for (const who of ['O','X']) for (const i of free) { const t = b.slice(); t[i] = who; if (tttWin(t) === who) return i; }
  if (!b[4]) return 4;
  const corners = [0,2,6,8].filter(i => !b[i]); if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
  return free[Math.floor(Math.random() * free.length)];
}
function hangSVG(n){
  const parts = ['<path d="M10 110H70M25 110V10H65V22"/>','<circle cx="65" cy="30" r="8"/>','<path d="M65 38V70"/>','<path d="M65 46L52 58"/>','<path d="M65 46L78 58"/>','<path d="M65 70L54 90"/>','<path d="M65 70L76 90"/>'];
  return `<svg class="hang" viewBox="0 0 100 120" aria-label="${n} von 6 Fehlern"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">${parts.slice(0, n + 1).join('')}</g></svg>`;
}
function gamesView(){

    if (!GM.mem) memNew(); const m = GM.mem, won = m.d.every(c => c.done);
    body = `<p class="note">Finde alle Paare. ${S.games?.mem != null ? `Dein Rekord: ${S.games.mem} Züge.` : ''}</p>
      <div class="memgrid">${m.d.map((c, i) => `<button class="memc ${c.open || c.done ? 'up' : ''} ${c.done ? 'done' : ''}" data-act="mem" data-i="${i}" aria-label="${c.open || c.done ? c.v : 'verdeckte Karte'}">${c.open || c.done ? c.v : '🦇'}</button>`).join('')}</div>
      <p class="gstat">${won ? `Geschafft in ${m.moves} Zügen!` : `Züge: ${m.moves}`}</p>`;
  } else if (game === 'ttt') {
    if (!GM.ttt) tttNew(); const t = GM.ttt, sym = v => v === 'X' ? '✝' : v === 'O' ? '☠' : '';
    const st = S.games?.ttt || {w:0, l:0, d:0};
    body = `<p class="note">Du spielst ✝, der Computer ☠. Drei in einer Reihe gewinnt.</p>
      <div class="tttgrid">${t.b.map((v, i) => `<button class="tttc" data-act="ttt" data-i="${i}" ${v || t.over || t.wait ? 'disabled' : ''} aria-label="Feld ${i + 1}">${sym(v)}</button>`).join('')}</div>
      <p class="gstat">${t.over === 'X' ? 'Du hast gewonnen!' : t.over === 'O' ? 'Der Totenkopf gewinnt.' : t.over === 'draw' ? 'Unentschieden.' : t.wait ? 'Der Totenkopf überlegt …' : 'Du bist dran.'} · Siege ${st.w} · Niederlagen ${st.l} · Unentschieden ${st.d}</p>`;
  } else if (game === 'hang') {
    if (!GM.hang) hangNew(); const h = GM.hang, won = [...h.w].every(ch => h.g.includes(ch)), lost = h.miss >= 6;
    body = `<p class="note">Errate das düstere Wort, bevor das Männchen hängt.</p>

function refreshDraft(){
  document.querySelectorAll('[data-act="topt"]').forEach(x => x.setAttribute('aria-pressed', draft[x.dataset.k] === x.dataset.v));
  document.querySelectorAll('.cpick').forEach(x => { if (/^#[0-9a-f]{6}$/i.test(draft[x.dataset.k])) x.value = draft[x.dataset.k]; });
  document.getElementById('preview').innerHTML = previewHTML();
  applyPage(draft);
}
document.addEventListener('input', e => {
  const x = e.target.closest('.cpick'); if (!x || !draft || x.matches('.bpick,.rpick')) return;
  draft[x.dataset.k] = x.value; refreshDraft();
});

// Beitragsbilder immer im gleichen Hochformat 4:5 wie bei Instagram (mittig zugeschnitten)
function cropImage(file, W=720, H=900, q=.78){
  return new Promise((ok, fail) => {
    const fr = new FileReader(); fr.onerror = fail;
    fr.onload = () => { const img = new Image(); img.onerror = fail; img.onload = () => {
      const sc = Math.max(W / img.width, H / img.height), w = W / sc, h = H / sc;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      c.getContext('2d').drawImage(img, (img.width - w) / 2, (img.height - h) / 2, w, h, 0, 0, W, H); ok(c.toDataURL('image/jpeg', q));
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function resizeImage(file, max0=900, q=.78){
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onerror = fail;
    fr.onload = () => { const img = new Image(); img.onerror = fail; img.onload = () => {
      const max = max0, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q));
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

    save(); go('profile', S.me); toast('Profil gespeichert');
  }
});

render();
